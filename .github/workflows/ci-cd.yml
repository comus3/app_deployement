name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov requests

    - name: Run unit tests
      run: |
        pytest tests/ -v --cov=app --cov-report=xml

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        scope: write:packages

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Deploy to Test Environment
      if: github.ref == 'refs/heads/develop'
      run: |
        echo "Deploying to test environment..."
        echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
        
        # Create test namespace if it doesn't exist
        kubectl create namespace test --dry-run=client -o yaml | kubectl apply -f -
        
        # Apply the test deployment
        kubectl apply -f k8s/deployment-test.yaml
        
        # Update the image in the deployment
        kubectl set image deployment/simple-api simple-api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} -n test
        
        # Wait for rollout to complete
        kubectl rollout status deployment/simple-api -n test --timeout=300s
        
        # Show deployment status
        kubectl get pods -n test -l app=simple-api
        echo "Test environment deployment completed!"

    - name: Deploy to Production Environment
      if: github.ref == 'refs/heads/main'
      run: |
        echo "Deploying to production environment..."
        echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
        
        # Create production namespace if it doesn't exist
        kubectl create namespace production --dry-run=client -o yaml | kubectl apply -f -
        
        # Apply the production deployment
        kubectl apply -f k8s/deployment-prod.yaml
        
        # Update the image in the deployment
        kubectl set image deployment/simple-api simple-api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} -n production
        
        # Wait for rollout to complete
        kubectl rollout status deployment/simple-api -n production --timeout=300s
        
        # Show deployment status
        kubectl get pods -n production -l app=simple-api
        echo "Production environment deployment completed!"
