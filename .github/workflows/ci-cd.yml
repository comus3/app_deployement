name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run unit tests
      run: |
        pytest tests/ -v --cov=app --cov-report=xml

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Kubernetes cluster setup removed - using local cron job for deployment

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      run: |
        IMAGE_TAG=$(date +'%Y%m%d-%H%M')
        docker build -t ${{ secrets.DOCKER_USERNAME }}/distributedproject:$IMAGE_TAG -f Dockerfile .
        docker push ${{ secrets.DOCKER_USERNAME }}/distributedproject:$IMAGE_TAG
        docker tag ${{ secrets.DOCKER_USERNAME }}/distributedproject:$IMAGE_TAG ${{ secrets.DOCKER_USERNAME }}/distributedproject:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/distributedproject:latest

    - name: Notify deployment ready
      run: |
        IMAGE_TAG=$(date +'%Y%m%d-%H%M')
        echo "Build completed successfully!"
        echo "Image pushed to Docker Hub: ${{ secrets.DOCKER_USERNAME }}/distributedproject:$IMAGE_TAG"
        echo "atest image: ${{ secrets.DOCKER_USERNAME }}/distributedproject:latest"
        echo "Local cron job will handle deployment to Kubernetes cluster"
        echo "Image details:"
        echo "   - Registry: Docker Hub"
        echo "   - Repository: ${{ secrets.DOCKER_USERNAME }}/distributedproject"
        echo "   - Tag: $IMAGE_TAG"
        echo "   - Latest: latest"
        echo "   - Commit: ${{ github.sha }}"
